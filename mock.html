<style>
:root{
  --bg:#F6F4FA;--fg:#2A2160;--line:#E3DEF0;
  --inv-bg:linear-gradient(135deg,#3A2E9E,#7B3FB0);--inv-solid:#3A2E9E;--inv-fg:#FFFFFF;--inv-mute:#CDC3F2;
  --ok:#6BF0B5;--warn:#FFD166;--err:#FF8FA3;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110E1B;--fg:#E4DFF7;--line:#271F3A;
    --inv-bg:linear-gradient(135deg,#5340D6,#8E3FBF);--inv-solid:#4B38C4;--inv-fg:#FFFFFF;--inv-mute:#D3CAF7;
    --ok:#6BF0B5;--warn:#FFD166;--err:#FF8FA3;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110E1B;--fg:#E4DFF7;--line:#271F3A;
  --inv-bg:linear-gradient(135deg,#5340D6,#8E3FBF);--inv-solid:#4B38C4;--inv-fg:#FFFFFF;--inv-mute:#D3CAF7;
  --ok:#6BF0B5;--warn:#FFD166;--err:#FF8FA3;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 0 130px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:block;width:100%;min-height:44px;padding:12px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:focus-visible{outline:2px solid var(--fg);outline-offset:-4px}
@media (hover:hover){.row:hover{background:rgba(84,60,200,.08)}}
.row[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg);font-weight:600}

.player{position:fixed;left:0;right:0;bottom:0;background:var(--inv-bg);color:var(--inv-fg);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px rgba(30,15,80,.3),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(110%);transition:transform .25s ease}
body:not([data-status="idle"]) .player{transform:none}
.player-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.player-in>div{min-width:0}
.name,.status,.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-size:16px;font-weight:600}
.name:empty{display:none}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--inv-mute);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--inv-mute);flex:none}
[data-status="playing"] .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(94,242,192,.22)}
[data-status="connecting"] .dot,[data-status="buffering"] .dot{background:var(--warn);animation:pulse 1s infinite}
[data-status="error"] .dot,[data-status="offline"] .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.title{font-size:14px;opacity:.8;margin-top:4px}
.title:empty{display:none}
.stop{all:unset;box-sizing:border-box;width:52px;height:52px;border-radius:50%;background:var(--inv-fg);color:var(--inv-solid);display:grid;place-items:center;cursor:pointer}
.stop:focus-visible{outline:2px solid var(--inv-fg);outline-offset:3px}
.stop::before{content:"";width:16px;height:16px;border-radius:3px;background:currentColor}
[data-status="offline"] .stop{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-status="idle">
<main><ul id="list"></ul></main>

<footer class="player" aria-live="polite">
  <div class="player-in">
    <div>
      <div class="name" id="name"></div>
      <div class="status"><span class="dot"></span><span id="status"></span></div>
      <div class="title" id="title"></div>
    </div>
    <button class="stop" id="stop" aria-label="Stop"></button>
  </div>
</footer>

<script>
const stations = [ // name + url only
  {name:"Groove Salad",        url:"https://ice1.somafm.com/groovesalad-128-mp3"},
  {name:"Drone Zone",          url:"https://ice1.somafm.com/dronezone-128-mp3"},
  {name:"Secret Agent",        url:"https://ice1.somafm.com/secretagent-128-mp3"},
  {name:"Lush",                url:"https://ice1.somafm.com/lush-128-mp3"},
  {name:"Indie Pop Rocks",     url:"https://ice1.somafm.com/indiepop-128-mp3"},
  {name:"Defcon",              url:"https://ice1.somafm.com/defcon-128-mp3"},
  {name:"Radio Swiss Classic", url:"https://stream.srg-ssr.ch/m/rsc_de/mp3_128"}
];

/* Backend contract (the page keeps no player state; mpv is the source of truth):
     POST /api/play    {"url": "..."}
     POST /api/stop
     GET  /api/status  -> {"state": "idle|connecting|buffering|playing|error",
                           "url": "<current stream url>|null", "title": "<icy-title>|null"} */
const API = "";
const active = ["connecting","buffering","playing"];
const labels = {connecting:"Connecting…", buffering:"Buffering…", playing:"Live",
                error:"Can’t play this stream", offline:"Backend unreachable"};
let st = {state:"idle"};
const $ = id => document.getElementById(id);

async function call(path, body){
  const r = await fetch(API + path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  return r.json().catch(() => ({}));
}
async function refresh(){
  try { st = await call("/api/status"); } catch { st = {state:"offline"}; }
  render();
}
async function act(path, body, optimistic){
  if (optimistic) { st = optimistic; render(); }
  try { await call(path, body); } catch {}
  refresh();
}

const list = $("list");
stations.forEach((s, i) => {
  const li = document.createElement("li");
  li.innerHTML = `<button class="row" data-i="${i}">${s.name}</button>`;
  list.appendChild(li);
});
list.addEventListener("click", e => {
  const b = e.target.closest(".row"); if (!b) return;
  const {url} = stations[+b.dataset.i];
  if (st.url === url && active.includes(st.state)) act("/api/stop", {}, {state:"idle"});
  else act("/api/play", {url}, {state:"connecting", url});
});
$("stop").onclick = () => act("/api/stop", {}, {state:"idle"});

function render(){
  document.body.dataset.status = st.state;
  const cur = stations.find(s => s.url === st.url);
  const on = active.includes(st.state) || st.state === "error";
  $("name").textContent = on && cur ? cur.name : "";
  $("status").textContent = labels[st.state] || "";
  $("title").textContent = st.state === "playing" && st.title ? st.title : "";
  list.querySelectorAll(".row").forEach(r =>
    r.setAttribute("aria-pressed", String(on && stations[+r.dataset.i].url === st.url)));
}

/* Preview without a backend: append #mock to the page URL. Delete this block in production. */
if (location.hash === "#mock") {
  let m = {state:"idle"}, t, n = 0;
  const tr = ["Halden Quay – Slow Tide", "Mira Voss – Paper Lanterns"];
  call = async (path, body) => {
    if (path === "/api/play") { clearTimeout(t); m = {state:"connecting", url:body.url};
      t = setTimeout(() => m = {state:"playing", url:body.url, title:tr[n++ % 2]}, 1500); }
    if (path === "/api/stop") { clearTimeout(t); m = {state:"idle"}; }
    return m;
  };
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
